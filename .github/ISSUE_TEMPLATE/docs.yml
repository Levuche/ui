name: Docs or Storybook
description: Something in the README or Storybook is wrong, missing or hard to follow.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: A README section or a Storybook page.
      placeholder: README, "Grid pages"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong or missing?
    validations:
      required: true

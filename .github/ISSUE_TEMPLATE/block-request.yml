name: Ask for a block or a change
description: A new block, or a new option on one that exists.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet? Start a discussion in **Ideas** first; it's easier to shape there.
  - type: textarea
    id: who
    attributes:
      label: Who is it for, and what do they want to do?
      placeholder: A podcaster wants listeners to play the latest episode without leaving the page.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What would the block do?
      description: What it shows, what a visitor can do with it, and what the creator can change.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do people do this today?
      description: A workaround, or a block that comes close.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and discussions for this.
          required: true
